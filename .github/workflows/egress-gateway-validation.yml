name: Egress gateway validation

on:
  push:
    branches:
      - security/shared-network-boundary
  pull_request:

jobs:
  go-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: egress-gateway
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - run: gofmt -w main.go main_test.go
      - run: go test -race -count=1 ./...
      - run: go vet ./...
      - run: go build -trimpath ./...
