name: Security boundary tests

on:
  push:
    branches:
      - main
      - security/shared-network-boundary
  pull_request:

jobs:
  python-security-boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependency
        run: python -m pip install requests beautifulsoup4
      - name: Run outbound-boundary unit tests
        run: python -m unittest discover -s tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Worker dependencies
        run: npm install
      - name: Type-check Worker bundle
        run: npm run typecheck
      - name: Run Worker network-policy tests
        run: npm run test:worker
