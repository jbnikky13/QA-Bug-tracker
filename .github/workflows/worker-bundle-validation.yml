name: Worker bundle validation

on:
  push:
    branches:
      - security/shared-network-boundary
  pull_request:

jobs:
  worker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm install
      - run: npm run typecheck
      - run: npm run test:worker
      - run: npx wrangler deploy --dry-run --outdir .worker-dry-run
