name = "qa-bug-tracker-worker"
main = "index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[browser]
binding = "MYBROWSER"

[[d1_databases]]
binding = "DB"
database_name = "qa-bug-tracker"
database_id = "8615931c-0249-4600-a59f-0e0363876ed2"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "qa-bug-tracker-screenshots"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "qa-scan-jobs"

[[queues.consumers]]
queue = "qa-scan-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
