name = "qa-bug-tracker-worker"
main = "index.ts"
compatibility_date = "2026-08-20"
compatibility_flags = ["nodejs_compat"]

[browser]
binding = "MYBROWSER"

[[d1_databases]]
binding = "DB"
database_name = "qa-bug-tracker"
database_id = "<YOUR-D1-DATABASE-ID>"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "qa-bug-tracker-screenshots"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "qa-scan-jobs"

[[queues.consumers]]
queue = "qa-scan-jobs"
max_batch_size = 1
max_batch_timeout = 5
