name = "qa-bug-tracker-worker"
main = "index.ts"
compatibility_date = "2026-11-19"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[browser]
binding = "MYBROWSER"

[[d1_databases]]
binding = "DB"
database_name = "qa-bug-tracker"
database_id = "8615931c-0249-4600-a59f-0e0363876ed2"

[[r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "qa-bug-tracker-screenshots"

[[queues.producers]]
binding = "SCAN_QUEUE"
queue = "qa-scan-jobs"

[[queues.consumers]]
queue = "qa-scan-jobs"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3

# Fully isolated staging resources. Secrets are configured separately with Wrangler.
[env.staging]
name = "qa-bug-tracker-worker-staging"
workers_dev = true

[env.staging.browser]
binding = "MYBROWSER"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "qa-bug-tracker-staging"
database_id = "6f1b979d-ab29-42ce-bf42-a04949e3054f"

[[env.staging.r2_buckets]]
binding = "SCREENSHOTS"
bucket_name = "qa-bug-tracker-staging-screenshots"

[[env.staging.queues.producers]]
binding = "SCAN_QUEUE"
queue = "qa-scan-jobs-staging"

[[env.staging.queues.consumers]]
queue = "qa-scan-jobs-staging"
max_batch_size = 1
max_batch_timeout = 5
max_retries = 3
dead_letter_queue = "qa-scan-jobs-staging-dlq"
